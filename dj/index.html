<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedda vom Mond Automixer</title>
  <link rel="stylesheet" href="css/dj.css">
</head>
<body>
  <div id="file-banner" class="file-banner">
    Serve this folder: <code>node dj/serve.js</code> then open <code>http://127.0.0.1:8787</code>
  </div>

  <section id="stage" class="stage-capture" data-capture="16:9" aria-label="Live mix output">
    <canvas data-role="stage-canvas" id="stage-canvas" width="1280" height="720"></canvas>
    <div id="stage-hud" class="stage-hud">
      <p id="hud-now" class="hud-now" data-role="hud-now"></p>
      <p id="hud-artist" class="hud-artist" data-role="hud-artist"></p>
      <p id="hud-album" class="hud-album" data-role="hud-album"></p>
      <p id="hud-yt" class="hud-yt" data-role="hud-yt"></p>
      <p id="gen-status" class="gen-status" data-role="status">idle</p>
      <p id="queue-count" class="queue-count" data-role="queue-count"></p>
      <p id="queue-activity" class="queue-activity" data-role="queue-activity" data-kind=""></p>
      <ol id="queue-log" class="queue-log" data-role="queue-log"></ol>
    </div>
  </section>

  <div id="shell" class="shell" data-phase="idle">
    <button type="button" id="magic-btn" class="magic">START THE MAGIC</button>
    <button type="button" id="play-btn" class="play" hidden>PLAY</button>
  </div>

  <script src="js/mixer.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/generate.js"></script>
  <script src="js/readiness.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/album.js"></script>
  <script src="js/one-press.js"></script>
  <script src="js/endless.js"></script>
  <script src="js/crate.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/comfy-client.js"></script>
  <script src="js/hex-analysis.js"></script>
  <script src="js/echo-mapping.js"></script>
  <script src="js/ghost-modes.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/magic-flow.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/app.js"></script>
  <script src="js/live-swap.js"></script>
  <script src="js/features/extras.js"></script>
  <script src="js/features/fullscreen-visuals.js"></script>
  <script src="js/features/output-clips.js"></script>
  <script src="js/features/pack-twelve.js"></script>
</body>
</html>
